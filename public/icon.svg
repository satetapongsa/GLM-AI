<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="gmr-grad-main" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#0b57d0"/>
      <stop offset="85%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="gmr-grad-orbit" x1="6" y1="24" x2="42" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="gmr-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Dark Rounded Canvas -->
  <rect width="48" height="48" rx="24" fill="#131314"/>
  
  <!-- Outer Orbit Energy Ring -->
  <ellipse cx="24" cy="24" rx="17" ry="7" transform="rotate(-30 24 24)" stroke="url(#gmr-grad-orbit)" stroke-width="2.2" stroke-dasharray="32 8 8 8" stroke-linecap="round"/>

  <!-- Core Radiant Goomiru Star -->
  <path d="M24 6 C24 16 16 24 6 24 C16 24 24 32 24 42 C24 32 32 24 42 24 C32 24 24 16 24 6 Z" fill="url(#gmr-grad-main)" filter="url(#gmr-glow)"/>

  <!-- Inner Sparkle Core -->
  <circle cx="24" cy="24" r="3.2" fill="#ffffff" filter="url(#gmr-glow)"/>
</svg>
